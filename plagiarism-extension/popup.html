<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      width: 380px; 
      font-family: 'Segoe UI', system-ui, sans-serif; 
      padding: 20px; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 520px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }
    h1 { font-size: 20px; font-weight: 700; color: #1f2937; }
    .subtitle { font-size: 12px; color: #6b7280; margin-bottom: 20px; }
    
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 4px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      transition: all 0.2s;
    }
    .tab.active {
      background: white;
      color: #667eea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 10px;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    
    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    /* Fixed & Improved CSS */
    #codeSection { padding-top: 5px; }
    
    .compiler-select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        margin-bottom: 12px;
        font-size: 14px;
        color: #1e293b;
        background-color: #fff;
    }

    #verifyCodeBtn {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    /* Image Drop Zone */
    .drop-zone {
      display: block;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      background: #f8fafc;
      transition: all 0.3s;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #667eea;
      background: #eff6ff;
    }
    .drop-icon { font-size: 32px; margin-bottom: 8px; display: block; }
    .drop-text { font-size: 13px; color: #475569; font-weight: 600; }
    
    #result, #imageResult { 
      margin-top: 20px; 
      display: none;
      text-align: center;
      padding: 20px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
    }
    
    .loading { display: none; text-align: center; padding: 20px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e5e7eb; border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .score-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 24px;
      margin: 0 auto 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .score-high { background: #dcfce7; color: #166534; } 
    .score-medium { background: #fef3c7; color: #92400e; } /* Amber for warnings */
    .score-low { background: #fee2e2; color: #991b1b; }
    
    #detailsText {
        font-size: 13px;
        color: #334155; /* Darker for readability */
        line-height: 1.5;
        text-align: left;
        margin-top: 8px;
        background: white;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #f1f5f9;
        max-height: 200px;
        overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">P</div>
      <h1>PlagDetect</h1>
    </div>
    <p class="subtitle">AI Plagiarism & Code Verification</p>
    
    <div class="tabs">
      <button class="tab active" data-mode="text">📝 Text</button>
      <button class="tab" data-mode="code">💻 Code</button>
      <button class="tab" data-mode="image">🖼️ Image</button>
    </div>
    
    <!-- Code Mode UI -->
    <div id="codeSection" style="display: none;">
        <p style="font-size: 13px; color: #4b5563; margin-bottom: 8px;">Verify logic & syntax:</p>
        <select id="compilerSelect" class="compiler-select">
            <option value="auto">✨ Auto-detect Language</option>
            <option value="javascript">JavaScript / Node.js</option>
            <option value="python">Python 3</option>
            <option value="java">Java</option>
            <option value="cpp">C++ (GCC)</option>
            <option value="c">C (GCC)</option>
        </select>
        <button id="verifyCodeBtn" class="btn">🔍 Check Code Plagiarism</button>
        <p style="font-size: 11px; color: #64748b; margin-top: 8px; text-align: center;">ℹ️ Select code on page, then check originality %</p>
    </div>

    <!-- Image Mode UI -->
    <div id="imageSection" style="display: none;">
        <div class="drop-zone" id="dropZone">
            <span class="drop-icon">📁</span>
            <span class="drop-text">Drag & Drop Image or Click</span>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        <img id="previewImage" style="max-width: 100%; border-radius: 8px; margin-bottom: 12px; display: none;">
    </div>

    <!-- Default Text UI -->
    <div id="textSection">
        <button id="checkSelection" class="btn">🔍 Check Selected Text</button>
        <button id="checkPage" class="btn btn-secondary">📄 Analyze Full Page</button>
    </div>
    
    <!-- Result Parsing -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p style="color: #6b7280; font-size: 13px;">Analyzing on server...</p>
    </div>

    <div id="result">
        <div class="score-circle" id="scoreValue">--</div>
        <div id="statusText" style="font-weight: 600; margin-bottom: 8px;"></div>
        <div id="detailsText"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
